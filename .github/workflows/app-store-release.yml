name: Prepare App Store Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to prepare
        type: choice
        options: [both, ios, macos]
        default: both
      mode:
        description: Full release or resume an independent stage (never submits)
        type: choice
        options: [full, upload, metadata, review, status]
        default: full
      build_number:
        description: Optional exact build for retries; full without it chooses an unused number after Apple inventory
        type: string
        default: ''
      artifact_run_id:
        description: Required for upload mode; run ID containing the signed artifact
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Both platforms share App Information. Serialize all releases of this app,
# including metadata-only runs. Never cancel an upload/signing run mid-flight.
concurrency:
  group: farport-app-store-release
  cancel-in-progress: false

jobs:
  audit:
    # Only explicitly trusted branches may receive environment signing secrets.
    if: github.repository == 'panandafog/Farport' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store
    outputs:
      build: ${{ steps.plan.outputs.build }}
    env:
      REQUESTED_PLATFORM: ${{ inputs.platform }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
      ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
      MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
      MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
      MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
      MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
      MAC_FINDER_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_FINDER_PROVISION_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r Scripts/release/requirements.txt
      - name: Validate ALL required secrets, screenshots, URLs and Apple build inventory
        id: plan
        run: python3 -m Scripts.release.plan
  prepare:
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ${{ vars.RELEASE_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    environment: app-store
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [ios, macos]
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      REQUESTED_PLATFORM: ${{ inputs.platform }}
      RELEASE_BUILD_NUMBER: ${{ needs.audit.outputs.build }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - name: Select requested platform
        id: selected
        shell: bash
        run: |
          if [[ "$REQUESTED_PLATFORM" == both || "$REQUESTED_PLATFORM" == "$RELEASE_PLATFORM" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.selected.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: steps.selected.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install API dependencies
        if: steps.selected.outputs.run == 'true'
        run: python3 -m pip install -r Scripts/release/requirements.txt
      - name: Configure Xcode
        if: steps.selected.outputs.run == 'true'
        env:
          RELEASE_XCODE_APP: ${{ vars.RELEASE_XCODE_APP }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_XCODE_APP" ]]; then
            sudo xcode-select -s "$RELEASE_XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
      - name: Initialize release identity and validate signing inputs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          MAC_FINDER_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_FINDER_PROVISION_PROFILE_BASE64 }}

        if: steps.selected.outputs.run == 'true'
        run: python3 -m Scripts.release.cli init --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Check existing version, active reviews and exact build
        if: steps.selected.outputs.run == 'true' && inputs.mode != 'status'
        id: probe
        run: python3 -m Scripts.release.cli probe --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - uses: ruby/setup-ruby@v1
        if: steps.selected.outputs.run == 'true' && steps.probe.outputs.ready != 'true' && steps.probe.outputs.existing != 'true' && (inputs.mode == 'full' || inputs.mode == 'upload')
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
      - name: Prepare reproducible production project and terminal tools
        if: steps.selected.outputs.run == 'true' && inputs.mode == 'full' && steps.probe.outputs.ready != 'true' && steps.probe.outputs.existing != 'true'
        run: |
          brew install swiftlint
          sh Scripts/lint.sh
          sh Scripts/xcodegen.sh generate
          git diff --exit-code -- Farport.xcodeproj App/Info.plist iOS/Info.plist FinderExtension/Info.plist AppTests/Info.plist
          sh Scripts/verify-project-generation.sh
          xcrun swift Scripts/verify-package-locks.swift
          xcrun swift Scripts/verify-sandbox.swift
          sh Scripts/prepare-terminal-build.sh
      - name: Archive and export signed App Store package
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          MAC_FINDER_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_FINDER_PROVISION_PROFILE_BASE64 }}
        if: steps.selected.outputs.run == 'true' && inputs.mode == 'full' && steps.probe.outputs.ready != 'true' && steps.probe.outputs.existing != 'true'
        run: python3 -m Scripts.release.cli build --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Preserve signed package before any Apple upload
        if: steps.selected.outputs.run == 'true' && inputs.mode == 'full' && steps.probe.outputs.ready != 'true' && steps.probe.outputs.existing != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-store-${{ matrix.platform }}-${{ github.run_id }}
          path: Build/Release/${{ matrix.platform }}/Artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Validate signed artifact source
        if: steps.selected.outputs.run == 'true' && inputs.mode == 'upload' && steps.probe.outputs.ready != 'true' && steps.probe.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -m Scripts.release.artifact_source
      - name: Restore signed package without rebuilding
        if: steps.selected.outputs.run == 'true' && inputs.mode == 'upload' && steps.probe.outputs.ready != 'true' && steps.probe.outputs.existing != 'true'
        uses: actions/download-artifact@v7
        with:
          name: app-store-${{ matrix.platform }}-${{ inputs.artifact_run_id }}
          path: Build/Release/${{ matrix.platform }}/Artifact/
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Upload binary (skip when exact build already exists)
        if: steps.selected.outputs.run == 'true' && steps.probe.outputs.ready != 'true' && (inputs.mode == 'full' || inputs.mode == 'upload')
        env:
          ASC_ALLOW_UPLOAD: '1'
        run: python3 -m Scripts.release.cli upload --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Wait for Apple build processing
        if: steps.selected.outputs.run == 'true' && steps.probe.outputs.ready != 'true' && (inputs.mode == 'full' || inputs.mode == 'upload' || inputs.mode == 'review')
        run: python3 -m Scripts.release.cli wait --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Upload existing metadata and screenshots
        if: steps.selected.outputs.run == 'true' && steps.probe.outputs.ready != 'true' && (inputs.mode == 'full' || inputs.mode == 'upload' || inputs.mode == 'metadata')
        run: python3 -m Scripts.release.cli metadata --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Select build and configure App Review Information
        env:
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
        if: steps.selected.outputs.run == 'true' && steps.probe.outputs.ready != 'true' && (inputs.mode == 'full' || inputs.mode == 'upload' || inputs.mode == 'review')
        run: python3 -m Scripts.release.cli review --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Prepare Draft Review Submission (does not submit)
        if: steps.selected.outputs.run == 'true' && steps.probe.outputs.ready != 'true' && (inputs.mode == 'full' || inputs.mode == 'upload' || inputs.mode == 'review')
        run: python3 -m Scripts.release.cli draft --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Verify actual Apple state, selected build and draft
        if: steps.selected.outputs.run == 'true' && (inputs.mode == 'status' || inputs.mode == 'full' || inputs.mode == 'upload' || inputs.mode == 'review' || steps.probe.outputs.ready == 'true')
        run: python3 -m Scripts.release.cli status --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Remove temporary credentials and signing state
        if: always() && steps.selected.outputs.run == 'true'
        shell: bash
        run: |
          cleanup_status=0
          python3 -m Scripts.release.cli cleanup --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER" || cleanup_status=$?
          rm -f -- "$RUNNER_TEMP/farport-$RELEASE_PLATFORM-AuthKey.p8"
          exit "$cleanup_status"
      - name: Job Summary
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        if: always() && steps.selected.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -f "Build/Release/$RELEASE_PLATFORM/report.json" ]]; then
            python3 -m Scripts.release.cli summary --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
          else
            echo "## Farport — $RELEASE_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
            echo 'ERROR: bootstrap failed before a release report could be created. Check dependency/Xcode setup. No ready-for-review claim is made.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve non-sensitive release report
        if: always() && steps.selected.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-store-report-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            Build/Release/${{ matrix.platform }}/report.json
            Build/Release/${{ matrix.platform }}/summary.md
          if-no-files-found: ignore
