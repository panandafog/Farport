name: Upload App Store Build
run-name: Upload · build ${{ inputs.build_number || 'auto' }} · ${{ inputs.platform }}
env:
  RELEASE_PIPELINE: upload

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to prepare
        type: choice
        options: [both, ios, macos]
        default: both
      source:
        description: Build a new package or restore a previously signed artifact
        type: choice
        options: [build, artifact]
        default: build
      build_number:
        description: Exact build for retries; blank for a NEW build with an automatically chosen number
        type: string
        default: ''
      artifact_run_id:
        description: Required only for source=artifact; original run ID containing the signed package
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Both platforms share App Information. Serialize all releases of this app,
# including metadata-only runs. Never cancel an upload/signing run mid-flight.
concurrency:
  group: farport-app-store-release
  cancel-in-progress: false

jobs:
  audit:
    # Only explicitly trusted branches may receive environment signing secrets.
    if: github.repository == 'panandafog/Farport' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: app-store
    outputs:
      build: ${{ steps.plan.outputs.build }}
    env:
      REQUESTED_PLATFORM: ${{ inputs.platform }}
      RELEASE_MODE: ${{ inputs.source == 'artifact' && 'upload' || 'full' }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
      MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
      MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
      MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
      MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
      MAC_FINDER_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_FINDER_PROVISION_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.12'
      - name: Install API dependencies
        id: install_api
        run: python3 -m pip install -r Scripts/release/requirements.txt
      - name: Validate signing inputs and Apple build inventory
        id: plan
        run: python3 -m Scripts.release.plan
      - name: Explain preflight result
        if: always() && steps.checkout.outcome == 'success'
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
          RELEASE_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 -m Scripts.release.reporting platform --platform audit --build-number "${{ steps.plan.outputs.build }}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: app-store-report-audit-${{ github.run_id }}
          path: Build/Release/audit/
          if-no-files-found: error
  prepare:
    name: Upload build (${{ matrix.platform }})
    needs: audit
    if: needs.audit.result == 'success'
    runs-on: ${{ vars.RELEASE_MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    environment: app-store
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [ios, macos]
    env:
      RELEASE_MODE: ${{ inputs.source == 'artifact' && 'upload' || 'full' }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      REQUESTED_PLATFORM: ${{ inputs.platform }}
      RELEASE_BUILD_NUMBER: ${{ needs.audit.outputs.build }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - name: Select requested platform
        id: selected
        shell: bash
        run: |
          if [[ "$REQUESTED_PLATFORM" == both || "$REQUESTED_PLATFORM" == "$RELEASE_PLATFORM" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        id: checkout
        if: steps.selected.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: python
        if: steps.selected.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install API dependencies
        id: install_api
        if: steps.selected.outputs.run == 'true'
        run: python3 -m pip install -r Scripts/release/requirements.txt
      - name: Configure Xcode
        id: configure_xcode
        if: steps.selected.outputs.run == 'true'
        env:
          RELEASE_XCODE_APP: ${{ vars.RELEASE_XCODE_APP }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_XCODE_APP" ]]; then
            sudo xcode-select -s "$RELEASE_XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
      - name: Initialize release identity and validate signing inputs
        id: init
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          MAC_FINDER_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_FINDER_PROVISION_PROFILE_BASE64 }}

        if: steps.selected.outputs.run == 'true'
        run: python3 -m Scripts.release.cli init --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Check exact build (leave existing review drafts unchanged)
        if: steps.selected.outputs.run == 'true'
        id: probe
        run: python3 -m Scripts.release.cli probe --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - uses: ruby/setup-ruby@v1
        if: steps.selected.outputs.run == 'true' && steps.probe.outputs.existing != 'true'
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Prepare reproducible production project and terminal tools
        id: prepare_tools
        if: steps.selected.outputs.run == 'true' && inputs.source == 'build' && steps.probe.outputs.existing != 'true'
        run: |
          brew install swiftlint
          sh Scripts/lint.sh
          sh Scripts/xcodegen.sh generate
          git diff --exit-code -- Farport.xcodeproj App/Info.plist iOS/Info.plist FinderExtension/Info.plist AppTests/Info.plist
          sh Scripts/verify-project-generation.sh
          xcrun swift Scripts/verify-package-locks.swift
          xcrun swift Scripts/verify-sandbox.swift
          sh Scripts/prepare-terminal-build.sh
      - name: Archive and export signed App Store package
        id: archive
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_APP_DISTRIBUTION_P12_BASE64 }}
          MAC_APP_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_APP_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          MAC_FINDER_PROVISION_PROFILE_BASE64: ${{ secrets.MAC_FINDER_PROVISION_PROFILE_BASE64 }}
        if: steps.selected.outputs.run == 'true' && inputs.source == 'build' && steps.probe.outputs.existing != 'true'
        run: python3 -m Scripts.release.cli build --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Preserve signed package before any Apple upload
        id: save_package
        if: steps.selected.outputs.run == 'true' && inputs.source == 'build' && steps.probe.outputs.existing != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-store-${{ matrix.platform }}-${{ github.run_id }}
          path: Build/Release/${{ matrix.platform }}/Artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Validate signed artifact source
        id: source
        if: steps.selected.outputs.run == 'true' && inputs.source == 'artifact' && steps.probe.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -m Scripts.release.artifact_source
      - name: Restore signed package without rebuilding
        id: restore
        if: steps.selected.outputs.run == 'true' && inputs.source == 'artifact' && steps.probe.outputs.existing != 'true'
        uses: actions/download-artifact@v7
        with:
          name: app-store-${{ matrix.platform }}-${{ inputs.artifact_run_id }}
          path: Build/Release/${{ matrix.platform }}/Artifact/
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Upload binary (skip when exact build already exists)
        id: upload
        if: steps.selected.outputs.run == 'true'
        env:
          ASC_ALLOW_UPLOAD: '1'
        run: python3 -m Scripts.release.cli upload --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Wait for Apple build processing
        id: wait
        if: steps.selected.outputs.run == 'true'
        run: python3 -m Scripts.release.cli wait --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Confirm successful upload and show next action
        id: uploaded
        if: steps.selected.outputs.run == 'true'
        run: python3 -m Scripts.release.cli uploaded --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Remove temporary credentials and signing state
        id: cleanup
        if: always() && steps.selected.outputs.run == 'true' && (steps.init.outcome == 'success' || steps.init.outcome == 'failure')
        shell: bash
        run: |
          cleanup_status=0
          python3 -m Scripts.release.cli cleanup --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER" || cleanup_status=$?
          rm -f -- "$RUNNER_TEMP/farport-$RELEASE_PLATFORM-AuthKey.p8"
          exit "$cleanup_status"
      - name: Explain platform result
        if: always() && steps.selected.outputs.run == 'true' && steps.checkout.outcome == 'success'
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
          RELEASE_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 -m Scripts.release.reporting platform --platform "$RELEASE_PLATFORM" --build-number "$RELEASE_BUILD_NUMBER"
      - name: Preserve release report
        if: always() && steps.selected.outputs.run == 'true' && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: app-store-report-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            Build/Release/${{ matrix.platform }}/report.json
            Build/Release/${{ matrix.platform }}/summary.md
          if-no-files-found: error
  result:
    name: Release result and next steps
    needs: [audit, prepare]
    if: always() && github.repository == 'panandafog/Farport' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect platform and preflight reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: app-store-report-*-${{ github.run_id }}
          path: Build/ReleaseReports
      - name: Show outcome, reason and exact next action
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          AUDIT_STATUS: ${{ needs.audit.result }}
          PLATFORM_STATUS: ${{ needs.prepare.result }}
        run: python3 -m Scripts.release.reporting aggregate
