name: Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  tests:
    name: Lint and Package Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install test tools
        run: brew install swiftlint tmux

      - name: SwiftLint
        run: sh Scripts/lint.sh

      - name: Prepare isolated SSH fixture
        run: |
          python3 -m venv "$RUNNER_TEMP/harbor-test-env"
          "$RUNNER_TEMP/harbor-test-env/bin/pip" install -r Scripts/requirements-test.txt

      - name: Test SSH, SFTP, ProxyJump, and tmux
        run: |
          swift package --force-resolved-versions resolve
          "$RUNNER_TEMP/harbor-test-env/bin/python" Scripts/ssh_fixture.py --tmux --run-tests

  build:
    name: Build macOS (${{ matrix.configuration }})
    # Compile Icon Composer assets on Tahoe; keep package compatibility tests on macOS 15.
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: |
          sw_vers
          xcodebuild -version
          printf 'Commit: %s; attempt: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT"

      - name: Install build tools
        run: |
          brew install swiftlint
          sh Scripts/xcodegen.sh --version

      - name: Regenerate Xcode project
        run: |
          sh Scripts/xcodegen.sh generate
          git diff --exit-code -- Harbor.xcodeproj App/Info.plist FinderExtension/Info.plist AppTests/Info.plist

      - name: Build without signing
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Harbor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Harbor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          mkdir -p "$RUNNER_TEMP/HarborDiagnostics"
          xcodebuild -project Harbor.xcodeproj -scheme Harbor \
            -configuration "${{ matrix.configuration }}" -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HarborBuild" \
            -resultBundlePath "$RUNNER_TEMP/HarborDiagnostics/Harbor.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/HarborDiagnostics/build.log"

      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/HarborDiagnostics/
          if-no-files-found: ignore
          retention-days: 7
