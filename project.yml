name: Farport
configs:
  Debug: debug
  Release: release
  Local: debug
options:
  developmentLanguage: en
  bundleIdPrefix: com.panandafog
  postGenCommand: xcrun swift Scripts/configure-debugging.swift
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  deploymentTarget:
    macOS: "15.0"
packages:
  FarportKit:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.10.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3HG9ZBM8AV
    REGISTER_APP_GROUPS: YES
    HARBOR_APP_GROUP: group.dev.harbor.shared.$(DEVELOPMENT_TEAM)
    HARBOR_KEYCHAIN_GROUP: $(AppIdentifierPrefix)dev.harbor.shared
    HARBOR_ICLOUD_CONTAINER: iCloud.com.panandafog.harbor
targets:
  Farport:
    type: application
    productName: Farport
    platform: macOS
    sources:
      - App
      - SharedUI
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Farport
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HarborAppGroup: $(HARBOR_APP_GROUP)
        HarborKeychainGroup: $(HARBOR_KEYCHAIN_GROUP)
        HarborCloudContainer: $(HARBOR_ICLOUD_CONTAINER)
        NSLocalNetworkUsageDescription: Farport connects to your saved SSH and SFTP servers on the local network, including folders you connect to Finder.
        LSApplicationCategoryType: public.app-category.developer-tools
    attributes:
      SystemCapabilities:
        com.apple.Sandbox:
          enabled: 1
        com.apple.ApplicationGroups:
          enabled: 1
        com.apple.Keychain:
          enabled: 1
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    preBuildScripts:
      - name: SwiftLint
        script: /bin/sh "$SRCROOT/Scripts/lint.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: FarportKit
        product: FarportLocalization
      - package: FarportKit
        product: FarportSessions
      - package: FarportKit
        product: FarportCore
      - package: FarportKit
        product: FarportSecurity
      - package: FarportKit
        product: FarportCloud
      - package: FarportKit
        product: FarportSSH
      - package: SwiftTerm
      - package: FarportKit
        product: FarportFinder
      - target: FarportFinderExtension
        embed: true
    settings:
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: App/FarportLocal.entitlements
          HARBOR_ICLOUD_CONTAINER: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG HARBOR_LOCAL
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panandafog.harbor
        PRODUCT_NAME: Farport
        PRODUCT_MODULE_NAME: Farport
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Farport
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Farport"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Farport.entitlements
  FarportMobile:
    type: application
    productName: Farport
    platform: iOS
    deploymentTarget: "17.0"
    preBuildScripts:
      - name: SwiftLint
        script: /bin/sh "$SRCROOT/Scripts/lint.sh"
        basedOnDependencyAnalysis: false
    sources:
      - iOS
      - SharedUI
      - path: App/Assets.xcassets
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Farport
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HarborKeychainGroup: $(HARBOR_KEYCHAIN_GROUP)
        HarborCloudContainer: $(HARBOR_ICLOUD_CONTAINER)
        NSLocalNetworkUsageDescription: Farport connects to your saved SSH servers on the local network.
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    attributes:
      SystemCapabilities:
        com.apple.Keychain:
          enabled: 1
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    dependencies:
      - package: FarportKit
        product: FarportSessions
      - package: FarportKit
        product: FarportCore
      - package: FarportKit
        product: FarportLocalization
      - package: FarportKit
        product: FarportSSH
      - package: FarportKit
        product: FarportSecurity
      - package: FarportKit
        product: FarportCloud
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panandafog.harbor
        PRODUCT_MODULE_NAME: FarportMobile
        PRODUCT_NAME: Farport
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: iOS/FarportMobile.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: iOS/FarportMobileLocal.entitlements
          HARBOR_ICLOUD_CONTAINER: ""
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEBUG HARBOR_LOCAL
  FarportMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - iOSTests
      - iOS/MobileTerminalModel.swift
      - iOS/MobileWorkspaceView.swift
      - iOS/MobileLibraryView.swift
      - iOS/MobileAppRoot.swift
      - SharedUI/TerminalPalette.swift
      - SharedUI/HostEditor.swift
      - SharedUI/CloudSyncView.swift
      - SharedUI/EmptyHostLibraryView.swift
      - SharedUI/ServerTrustViews.swift
      - SharedUI/SheetFrame.swift
    dependencies:
      - target: FarportMobile
      - package: FarportKit
        product: FarportCore
      - package: FarportKit
        product: FarportSessions
      - package: FarportKit
        product: FarportLocalization
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panandafog.harbor.mobiletests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  FarportFinderExtension:
    type: app-extension
    platform: macOS
    sources: [FinderExtension]
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups:
          enabled: 1
        com.apple.Keychain:
          enabled: 1
    dependencies:
      - package: FarportKit
        product: FarportFinder
      - package: FarportKit
        product: FarportCore
    info:
      path: FinderExtension/Info.plist
      properties:
        CFBundleDisplayName: Farport Files
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HarborAppGroup: $(HARBOR_APP_GROUP)
        HarborKeychainGroup: $(HARBOR_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionFileProviderDocumentGroup: $(HARBOR_APP_GROUP)
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDownloadPipelineDepth: 2
          NSExtensionFileProviderUploadPipelineDepth: 1
          NSExtensionFileProviderMetadataOnlyUploadPipelineDepth: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panandafog.harbor.finder
        PRODUCT_NAME: FarportFinderExtension
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FarportFinder.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
  FarportAppTests:
    type: bundle.unit-test
    platform: macOS
    info:
      path: AppTests/Info.plist
      properties:
        CFBundleDisplayName: Farport Tests
    sources:
      - AppTests
      - Tests/FarportCoreTests/FinderWriteFixture.swift
      - Tests/FarportCoreTests/TestSecretStore.swift
      - Tests/FarportSSHTests/FixtureTrust.swift
      - path: FinderExtension
        includes: ["*.swift"]
    dependencies:
      - target: Farport
      - package: FarportKit
        product: FarportCloud
      - package: FarportKit
        product: FarportCore
      - package: SwiftTerm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.panandafog.HarborAppTests
schemes:
  Farport iOS:
    build:
      targets:
        FarportMobile: all
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        HARBOR_ISOLATED_TESTS: "1"
      targets: [FarportMobileTests]
  Farport iOS Local:
    build:
      targets:
        FarportMobile: all
    run:
      config: Local
    test:
      config: Local
      environmentVariables:
        HARBOR_ISOLATED_TESTS: "1"
      targets: [FarportMobileTests]
  Farport Attach:
    build:
      targets:
        Farport: [run]
    run:
      config: Debug
  FarportLocal:
    build:
      targets:
        Farport: all
    run:
      config: Local
    test:
      config: Local
      environmentVariables:
        HARBOR_ISOLATED_TESTS: "1"
      targets: [FarportAppTests]
  Farport:
    build:
      targets:
        Farport: all
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        HARBOR_ISOLATED_TESTS: "1"
      targets: [FarportAppTests]
